name: Docker Build

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$(tr -d '\r\n' < version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version.txt must contain a version such as 5.0.0" >&2
            exit 1
          fi
          revision="${GITHUB_SHA:0:12}"
          tag="${version}-${revision}"
          if [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            tag="${version}-dev-${revision}"
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$image:$tag"
            if [[ "$PUBLISH_IMAGE" == "true" ]]; then
              if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
                echo "$image:latest"
              else
                echo "$image:dev"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
